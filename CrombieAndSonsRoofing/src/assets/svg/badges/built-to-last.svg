<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="plateBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Plate -->
  <rect x="18" y="24" width="64" height="56" rx="10"
        fill="url(#plateBg)"
        filter="url(#plateShadow)"/>

  <!-- Border -->
  <rect x="22" y="28" width="56" height="48" rx="8"
        fill="none"
        stroke="url(#plateBorder)"
        stroke-width="2.2"/>

  <!-- Roof icon (centered properly) -->
  <path d="M32 54 L50 40 L68 54"
        stroke="#dcfce7"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
  <path d="M38 54 V66 H62 V54"
        stroke="#dcfce7"
        stroke-width="4"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <text x="50" y="105"
        text-anchor="middle"
        fill="#14532d"
        font-size="7"
        font-weight="800"
        font-family="Arial, Helvetica, sans-serif">
    BUILT TO LAST
  </text>
</svg>