<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="weatherBgMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Inner depth gradient -->
    <linearGradient id="weatherInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Border gradient -->
    <linearGradient id="weatherBorderNew" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="weatherShadowNew" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Angled plate shape -->
  <path d="M18 26 
           L82 26 
           L74 78 
           L26 78 Z"
        fill="url(#weatherBgMain)"
        filter="url(#weatherShadowNew)"/>

  <!-- Inner panel -->
  <path d="M22 30 
           L78 30 
           L72 74 
           L28 74 Z"
        fill="url(#weatherInner)"/>

  <!-- Border -->
  <path d="M22 30 
           L78 30 
           L72 74 
           L28 74 Z"
        fill="none"
        stroke="url(#weatherBorderNew)"
        stroke-width="2"/>

  <!-- Cloud (raised slightly for balance) -->
  <path d="M38 44
           C42 38 48 38 51 41
           C53 36 59 34 63 36
           C68 38 70 42 69 45
           C68 48 66 50 62 50
           H40
           C36 50 34 48 34 45
           C34 43 35 41 38 40"
        fill="#fff7ed"/>

  <!-- Rain (tight + centered, no overflow) -->
  <path d="M44 54 L42 60 
           M50 54 L48 60 
           M56 54 L54 60"
        stroke="#fff7ed"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Text -->
  <text x="50" y="105"
        text-anchor="middle"
        fill="#7f1d1d"
        font-size="7"
        font-weight="800"
        font-family="Arial, Helvetica, sans-serif"
        letter-spacing="0.6">
    WEATHER TESTED
  </text>
</svg>